[package]
name = "hypermesh-visor-mobile"
version = "0.1.0"
edition = "2021"
publish = false

# Keep mobile's app-owned store separate from desktop feature unification.
[workspace]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "mobile-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
hypermesh-session = { path = "../../session", default-features = false, features = ["external-store"] }
uniffi = { version = "=0.32.2", default-features = false }
thiserror = "2"

base64 = "0.22"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

sha2 = "0.10"
zeroize = "1"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
