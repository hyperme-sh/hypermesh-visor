[package]
name = "hypermesh-local-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
hypermesh-local-storage = { path = "../local-storage" }
tokio = { version = "1", features = ["net", "time", "io-util"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemServices"] }
