name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Native package launcher contracts
        run: |
          python3 native/macos/test-package.py --self-test
          python3 native/macos/test-keychain.py --self-test
      - name: Check Conductor shutdown observer
        run: python3 ci/test-conductor-process.py
      - name: Check embedded includes
        run: bash ci/check-includes.sh
      - name: Check display harness process identity
        run: python3 ci/display/test-process-identity.py
      - name: Check MCP SSE fixture disconnect observation
        run: python3 ci/display/test-mcp-http-fixture.py
      - name: Check display typing interruption observer
        run: python3 ci/display/test-interrupt-type.py
      - run: cargo test --locked --workspace
      - name: Session CLI terminal unit contracts
        run: |
          cargo build --locked -p hypermesh-companion
          python3 companion/tests/session_cli_terminal.py

  native-session:
    name: Session units (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Native session and PKCE unit contracts
        run: cargo test --locked -p hypermesh-session
      - name: Native inverse MCP client unit contracts and build
        run: |
          cargo test --locked -p hypermesh-visor-client
          cargo build --locked -p hypermesh-visor-client --bin hypermesh-desktop-mcp-client
      - name: Record Windows client checksum and source
        if: matrix.os == 'windows-latest'
        run: |
          $clientHash = (Get-FileHash target/debug/hypermesh-desktop-mcp-client.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$clientHash *hypermesh-desktop-mcp-client.exe" | Set-Content target/debug/hypermesh-desktop-mcp-client.exe.sha256 -Encoding ascii
          git rev-parse HEAD | Set-Content target/debug/inverse-client-source-revision.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: windows-inverse-mcp-client
          retention-days: 1
          if-no-files-found: error
          path: |
            target/debug/hypermesh-desktop-mcp-client.exe
            target/debug/hypermesh-desktop-mcp-client.exe.sha256
            target/debug/inverse-client-source-revision.txt
      - name: App-supplied session store unit contracts
        run: cargo test --locked -p hypermesh-session --no-default-features --features external-store
      - name: Mobile store bridge unit contracts
        run: cargo test --locked --manifest-path mobile/core/Cargo.toml
      - name: Generate mobile language bindings
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cargo build --locked --manifest-path mobile/core/Cargo.toml --features bindgen
          extension=so
          if [[ "$RUNNER_OS" == macOS ]]; then extension=dylib; fi
          mobile/core/target/debug/mobile-bindgen generate --no-format \
            --library "mobile/core/target/debug/libhypermesh_visor_mobile.$extension" \
            --language swift --language kotlin --out-dir "$RUNNER_TEMP/mobile-bindings"
      - name: Kotlin native store callback contract
        if: matrix.os == 'ubuntu-latest'
        run: |
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy \
            -Dartifact=net.java.dev.jna:jna:5.17.0 -DoutputDirectory="$RUNNER_TEMP/mobile-kotlin"
          jna="$RUNNER_TEMP/mobile-kotlin/jna-5.17.0.jar"
          kotlinc "$RUNNER_TEMP/mobile-bindings/uniffi/hypermesh_visor_mobile/hypermesh_visor_mobile.kt" \
            mobile/tests/Main.kt mobile/tests/AndroidStoreContract.kt mobile/android/EncryptedSessionStore.kt -classpath "$jna" -include-runtime -d "$RUNNER_TEMP/mobile-kotlin/contract.jar"
          java -Djna.library.path="$PWD/mobile/core/target/debug" \
            -cp "$RUNNER_TEMP/mobile-kotlin/contract.jar:$jna" MainKt
      - name: Compile Android KeyStore adapter
        if: matrix.os == 'ubuntu-latest'
        run: |
          android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          if [ ! -f "$android_jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" >/dev/null
          fi
          test -f "$android_jar"
          kotlinc "$RUNNER_TEMP/mobile-bindings/uniffi/hypermesh_visor_mobile/hypermesh_visor_mobile.kt" \
            mobile/android/EncryptedSessionStore.kt mobile/android/AndroidSessionStore.kt \
            -classpath "$android_jar:$RUNNER_TEMP/mobile-kotlin/jna-5.17.0.jar" \
            -d "$RUNNER_TEMP/mobile-kotlin/android-store.jar"
      - name: Swift native store callback contract
        if: matrix.os == 'macos-latest'
        run: |
          swiftc -I "$RUNNER_TEMP/mobile-bindings" \
            -Xcc "-fmodule-map-file=$RUNNER_TEMP/mobile-bindings/hypermesh_visor_mobileFFI.modulemap" \
            "$RUNNER_TEMP/mobile-bindings/hypermesh_visor_mobile.swift" mobile/apple/KeychainSessionStore.swift \
            mobile/tests/KeychainContract.swift mobile/tests/main.swift \
            -L mobile/core/target/debug -lhypermesh_visor_mobile \
            -Xlinker -rpath -Xlinker "$PWD/mobile/core/target/debug" \
            -o "$RUNNER_TEMP/mobile-store-contract"
          "$RUNNER_TEMP/mobile-store-contract"
      - name: iOS session core build
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked -p hypermesh-session --no-default-features --features external-store --target aarch64-apple-ios
          cargo build --locked --manifest-path mobile/core/Cargo.toml --lib --target aarch64-apple-ios
          swiftc -target arm64-apple-ios15.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -parse-as-library -emit-module -module-name VisorMobileStore \
            -I "$RUNNER_TEMP/mobile-bindings" \
            -Xcc "-fmodule-map-file=$RUNNER_TEMP/mobile-bindings/hypermesh_visor_mobileFFI.modulemap" \
            "$RUNNER_TEMP/mobile-bindings/hypermesh_visor_mobile.swift" mobile/apple/KeychainSessionStore.swift \
            -emit-module-path "$RUNNER_TEMP/VisorMobileStore.swiftmodule"
          cargo tree --locked -p hypermesh-session --no-default-features --features external-store --target aarch64-apple-ios -e normal --prefix none > "$RUNNER_TEMP/ios-session-deps.txt"
          ! grep -E '^(keyring|secret-service|zbus|x11rb) ' "$RUNNER_TEMP/ios-session-deps.txt"
          cargo tree --locked --manifest-path mobile/core/Cargo.toml --target aarch64-apple-ios -e normal --prefix none > "$RUNNER_TEMP/ios-mobile-deps.txt"
          ! grep -E '^(keyring|secret-service|zbus|x11rb) ' "$RUNNER_TEMP/ios-mobile-deps.txt"
      - name: Android session core build
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add aarch64-linux-android
          ndk_tools="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_tools/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$ndk_tools/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          test -x "$CC_aarch64_linux_android"
          cargo build --locked -p hypermesh-session --no-default-features --features external-store --target aarch64-linux-android
          cargo build --locked --manifest-path mobile/core/Cargo.toml --lib --target aarch64-linux-android
          cargo tree --locked -p hypermesh-session --no-default-features --features external-store --target aarch64-linux-android -e normal --prefix none > "$RUNNER_TEMP/android-session-deps.txt"
          ! grep -E '^(keyring|secret-service|zbus|x11rb) ' "$RUNNER_TEMP/android-session-deps.txt"
          cargo tree --locked --manifest-path mobile/core/Cargo.toml --target aarch64-linux-android -e normal --prefix none > "$RUNNER_TEMP/android-mobile-deps.txt"
          ! grep -E '^(keyring|secret-service|zbus|x11rb) ' "$RUNNER_TEMP/android-mobile-deps.txt"
          if cargo check --locked -p hypermesh-session --features external-store > "$RUNNER_TEMP/store-feature-conflict.txt" 2>&1; then
            echo 'Conflicting store features unexpectedly compiled' >&2
            exit 1
          fi
          grep -F 'external-store requires --no-default-features' "$RUNNER_TEMP/store-feature-conflict.txt"

      - uses: actions/setup-go@v6
        if: matrix.os == 'windows-latest'
        with:
          go-version-file: third_party/hypermesh-cli/go.mod
          cache: false
      - name: Build isolated CLI credential contract helper
        if: matrix.os == 'windows-latest'
        working-directory: third_party/hypermesh-cli
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
        run: |
          New-Item -ItemType Directory -Path cmd/visor-credential-contract
          Copy-Item ../../native/windows/credential-contract.go cmd/visor-credential-contract/main.go
          go build -mod=readonly -buildvcs=false -o "$env:RUNNER_TEMP/visor-credential-contract.exe" ./cmd/visor-credential-contract
      - name: Isolated Windows Credential Manager unit contract
        if: matrix.os == 'windows-latest'
        env:
          HYPERMESH_CREDENTIAL_CONTRACT: '1'
          HYPERMESH_CREDENTIAL_HELPER: ${{ runner.temp }}/visor-credential-contract.exe
        run: cargo test --locked -p hypermesh-session store::tests::windows_credential_store_contract -- --ignored --exact

  native-cli:
    name: Bundled CLI units (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/hypermesh-cli/go.mod
          cache: false
      - name: Native browser and OAuth unit contracts
        working-directory: third_party/hypermesh-cli
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
        run: |
          go test -mod=readonly ./internal/browser ./internal/oauth
          go build -mod=readonly -buildvcs=false ./cmd/hypermesh

  native-mcp-discovery:
    name: MCP discovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Test shared discovery code on the native filesystem
        run: cargo test --locked --manifest-path ci/mcp-discovery/Cargo.toml

  native-macos-workspace:
    name: Native macOS workspace
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version-file: third_party/hypermesh-cli/go.mod
          cache: false
      - name: Build native development distribution
        run: bash native/macos/package-development.sh "$RUNNER_TEMP/visor-distribution"
      - name: Native event mapping and unauthenticated bridge refusal
        run: |
          "$RUNNER_TEMP/visor-distribution/hypermesh-visor-macos-arm64/Hypermesh Visor Development.app/Contents/MacOS/hypermesh-native-desktop" --self-test
          python3 native/macos/test-bridge-refusal.py "$RUNNER_TEMP/visor-distribution/hypermesh-visor-macos-arm64/Hypermesh Visor Development.app/Contents/MacOS/hypermesh-native-desktop"
      - name: Native CLI isolated keychain contract
        run: python3 native/macos/test-keychain.py
      - name: Native workspace unit contracts
        env:
          TMPDIR: /tmp
        run: cargo test --locked --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ runner.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/visor-distribution/hypermesh-visor-macos-arm64.zip
            ${{ runner.temp }}/visor-distribution/hypermesh-visor-macos-arm64.zip.sha256
