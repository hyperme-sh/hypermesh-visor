name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Conductor shutdown observer
        run: python3 ci/test-conductor-process.py
      - name: Check embedded includes
        run: bash ci/check-includes.sh
      - name: Check display harness process identity
        run: python3 ci/display/test-process-identity.py
      - name: Check MCP SSE fixture disconnect observation
        run: python3 ci/display/test-mcp-http-fixture.py
      - name: Check display typing interruption observer
        run: python3 ci/display/test-interrupt-type.py
      - run: cargo test --locked --workspace
      - name: Session CLI terminal unit contracts
        run: |
          cargo build --locked -p hypermesh-companion
          python3 companion/tests/session_cli_terminal.py

  native-mcp-discovery:
    name: MCP discovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Test shared discovery code on the native filesystem
        run: cargo test --locked --manifest-path ci/mcp-discovery/Cargo.toml

  native-macos-workspace:
    name: Native macOS workspace
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native development app
        run: bash native/macos/build-app.sh "$RUNNER_TEMP/Hypermesh Visor Development.app"
      - name: Native event mapping and unauthenticated bridge refusal
        run: |
          "$RUNNER_TEMP/Hypermesh Visor Development.app/Contents/MacOS/hypermesh-native-desktop" --self-test
          python3 native/macos/test-bridge-refusal.py "$RUNNER_TEMP/Hypermesh Visor Development.app/Contents/MacOS/hypermesh-native-desktop"
      - name: Native workspace unit contracts
        env:
          TMPDIR: /tmp
        run: cargo test --locked --workspace
      - name: Archive native development app
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Hypermesh Visor Development.app" "$RUNNER_TEMP/hypermesh-visor-macos.zip"
          cd "$RUNNER_TEMP"
          shasum -a 256 hypermesh-visor-macos.zip > hypermesh-visor-macos.zip.sha256
          printf '%s\n' "$SOURCE_REVISION" > hypermesh-visor-macos.source-revision
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ runner.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hypermesh-visor-macos.zip
            ${{ runner.temp }}/hypermesh-visor-macos.zip.sha256
            ${{ runner.temp }}/hypermesh-visor-macos.source-revision
