name: native crash SDK build contracts
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: crash-sdk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Capture ownership unit contracts
        run: cargo test --locked -p hypermesh-crash-guard
      - name: Runtime staging file contracts
        run: python3 native/crash/test-stage-runtime.py
      - name: Install Linux Crashpad build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Build pinned Sentry native SDK and Crashpad handler
        shell: bash
        run: bash native/crash/build-sdk.sh "$RUNNER_TEMP/visor-crash-sdk"
      - name: SDK option unit contract without capture
        shell: bash
        run: |
          cmake -S native/crash/contract -B "$RUNNER_TEMP/visor-crash-contract" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/visor-crash-sdk"
          cmake --build "$RUNNER_TEMP/visor-crash-contract" --config Release
          export PATH="$RUNNER_TEMP/visor-crash-sdk/bin:$PATH"
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$RUNNER_TEMP/visor-crash-contract/Release/visor-crash-sdk-contract.exe"
            "$RUNNER_TEMP/visor-crash-contract/Release/visor-crash-arguments-contract.exe"
          else
            "$RUNNER_TEMP/visor-crash-contract/visor-crash-sdk-contract"
            "$RUNNER_TEMP/visor-crash-contract/visor-crash-arguments-contract"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-crash-sdk-${{ matrix.os }}
          path: ${{ runner.temp }}/visor-crash-sdk
