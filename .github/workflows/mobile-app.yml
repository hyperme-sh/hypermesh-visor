name: Mobile app UI contracts
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'mobile/app/**'
      - '.github/workflows/mobile-app.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - run: python3 -m unittest discover -p test_stage_apple.py
      - run: npm ci
      - run: npm test
      - run: npm run build
