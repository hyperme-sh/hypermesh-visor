[package]
name = "hypermesh-crash-retention"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hypermesh-local-storage = { path = "../../../local-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Services", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
