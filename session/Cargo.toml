[package]
name = "hypermesh-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native-app OAuth session shared by the Hypermesh CLI and desktop companion"
publish = false

[features]
default = ["os-keyring"]
os-keyring = ["dep:keyring"]
# The embedding app supplies SessionStore; no keyring or file fallback is built.
external-store = []

[dependencies]
getrandom = "0.3.4"
url = "2"
libc = "0.2"
base64 = "0.22"
keyring = { optional = true, version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
