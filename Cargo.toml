[workspace]
members = [".", "companion", "session"]
resolver = "2"

[package]
name = "hypermesh-visor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Linux desktop visor for Hypermesh"
publish = false

[[bin]]
name = "hypermesh-desktop-mcp"
path = "src/bin/hypermesh-desktop-mcp.rs"
required-features = ["desktop"]

[[test]]
name = "inverse_mcp"
path = "tests/inverse_mcp.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:x11rb", "dep:zbus", "dep:tokio-rustls", "dep:webpki-roots", "hypermesh-session/os-keyring"]
headless = []

[dependencies]
axum = "0.7"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.3", features = ["tokio", "server", "service", "http1"] }
hypermesh-session = { path = "session", default-features = false }
libc = "0.2"
libloading = "0.8"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x11rb = { version = "0.13", features = ["xtest"], optional = true }
zbus = { version = "4.4", optional = true }
zeroize = { version = "1", features = ["derive"] }
jsonschema = { version = "0.58.6", default-features = false }

[dev-dependencies]
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
